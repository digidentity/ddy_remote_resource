name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.1', '3.2', '3.3']
        rails-version: ['7.2.3', '8.0.5']
        exclude:
          - ruby-version: '3.1' # Rails 8 requires Ruby >= 3.2
            rails-version: '8.0.5'

    name: Ruby ${{ matrix.ruby-version }} / Rails ${{ matrix.rails-version }}

    env:
      RAILS_VERSION: ${{ matrix.rails-version }}

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rake spec
